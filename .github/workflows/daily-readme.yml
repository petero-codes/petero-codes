name: Profile Update

on:
  schedule:
    # Runs daily at 06:00 UTC (09:00 EAT Nairobi time)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Readme Updater
        run: python scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config --global user.name "petero-codes"
          git config --global user.email "chapokumih@gmail.com"
          git add README.md assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update engineering insights [skip ci]"
            git push origin main
          fi
